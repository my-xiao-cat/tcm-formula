<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🪔 药香配方参考</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      background:#f5efe6;color:#333;min-height:100vh
    }
    .app{max-width:480px;margin:0 auto;padding:16px 16px 100px}

    /* Header */
    .header{
      text-align:center;padding:24px 0 16px;
      background:linear-gradient(135deg,#6b3a2a 0%,#a8613b 100%);
      margin:-16px -16px 16px;border-radius:0 0 24px 24px;padding:32px 16px 24px
    }
    .header h1{font-size:24px;color:#fff;font-weight:700}
    .header p{font-size:13px;color:rgba(255,255,255,.8);margin-top:4px}
    .header .sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:8px}

    /* Search / Input Card */
    .input-card{
      background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;
      box-shadow:0 4px 15px rgba(0,0,0,.06)
    }
    .input-card h3{
      font-size:15px;color:#6b3a2a;margin-bottom:12px;font-weight:600
    }

    /* Need Tags */
    .symptom-group{margin-bottom:14px}
    .symptom-group:last-child{margin-bottom:0}
    .symptom-label{
      font-size:13px;color:#666;margin-bottom:6px;font-weight:500
    }
    .tag-wrap{display:flex;flex-wrap:wrap;gap:8px}
    .tag{
      padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;
      border:1.5px solid #ddd;background:#fff;color:#555;
      transition:all .2s;user-select:none
    }
    .tag:active{transform:scale(.95)}
    .tag.selected{
      background:#a8613b;color:#fff;border-color:#a8613b
    }

    /* Submit Button */
    .submit-area{padding-top:8px}
    .btn-submit{
      width:100%;padding:14px;border:none;border-radius:12px;
      font-size:16px;font-weight:600;cursor:pointer;
      background:linear-gradient(135deg,#6b3a2a 0%,#a8613b 100%);color:#fff;
      transition:transform .15s,box-shadow .15s;
      box-shadow:0 4px 15px rgba(107,58,42,.3)
    }
    .btn-submit:active{transform:scale(.97)}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed}

    /* Result */
    .result-area{display:none}
    .result-area.show{display:block}

    .prescription-card{
      background:#fff;border-radius:16px;overflow:hidden;margin-bottom:14px;
      box-shadow:0 4px 15px rgba(0,0,0,.06)
    }
    .prescription-header{
      background:linear-gradient(135deg,#6b3a2a 0%,#a8613b 100%);
      padding:16px 20px;color:#fff
    }
    .prescription-header h2{font-size:20px;font-weight:700}
    .prescription-header .pinyin{font-size:12px;opacity:.7;margin-top:2px}
    .prescription-body{padding:16px 20px}

    .ingredient-list{margin-bottom:14px}
    .ingredient-list h4{
      font-size:14px;color:#6b3a2a;margin-bottom:8px;font-weight:600
    }
    .ingredient-item{
      display:flex;justify-content:space-between;padding:6px 0;
      border-bottom:1px solid #f0f0f0;font-size:14px
    }
    .ingredient-item:last-child{border-bottom:none}
    .ingredient-item .name{color:#333}
    .ingredient-item .amount{color:#999;font-size:13px}

    .action-section{
      background:#fff8f0;border-radius:12px;padding:14px;
      margin-bottom:14px;border-left:3px solid #c8a96e
    }
    .action-section h4{
      font-size:14px;color:#8b6914;margin-bottom:6px;font-weight:600
    }
    .action-section p{font-size:13px;color:#666;line-height:1.6}

    .method-section{
      background:#f5f0eb;border-radius:12px;padding:14px;
      margin-bottom:14px;border-left:3px solid #8b7355
    }
    .method-section h4{
      font-size:14px;color:#6b3a2a;margin-bottom:6px;font-weight:600
    }
    .method-section p{font-size:13px;color:#666;line-height:1.6}

    .caution-section{
      background:#fff0f0;border-radius:12px;padding:14px;
      margin-bottom:14px;border-left:3px solid #c62828
    }
    .caution-section h4{
      font-size:14px;color:#c62828;margin-bottom:6px;font-weight:600
    }
    .caution-section p{font-size:13px;color:#666;line-height:1.6}

    /* Reset Button */
    .btn-reset{
      width:100%;padding:12px;border:1.5px solid #ddd;border-radius:12px;
      font-size:14px;cursor:pointer;background:#fff;color:#666;
      transition:all .2s;margin-top:4px
    }
    .btn-reset:active{background:#f5f5f5}

    /* Footer */
    .footer-text{
      text-align:center;padding:20px 0;font-size:11px;color:#bbb;line-height:1.8
    }

    /* Badge */
    .match-badge{
      display:inline-block;padding:2px 10px;border-radius:10px;
      font-size:11px;font-weight:500;margin-top:6px
    }
    .match-badge.high{background:rgba(255,255,255,.2);color:#fff}
    .match-badge.medium{background:rgba(255,255,255,.15);color:#fff}

    /* Animations */
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .prescription-card{animation:fadeIn .35s ease}
    .action-section,.method-section,.caution-section{animation:fadeIn .35s ease}

    @media(max-width:400px){
      .app{padding:12px 12px 90px}
      .header{padding:24px 12px 20px}
      .tag{padding:5px 12px;font-size:12px}
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <h1>🪔 药香配方参考</h1>
      <p>根据需求，推荐传统药香方</p>
      <div class="sub">传承古法 · 以香养人</div>
    </div>

    <!-- Input Area -->
    <div class="input-card" id="inputCard">
      <h3>📋 请选择您的需求</h3>

      <div id="symptomContainer"></div>

      <div class="submit-area">
        <button class="btn-submit" id="btnSubmit" onclick="getPrescription()">
          🪔 查看推荐香方
        </button>
      </div>
    </div>

    <!-- Result Area -->
    <div class="result-area" id="resultArea">
      <div id="prescriptionContainer"></div>
      <button class="btn-reset" onclick="resetAll()">⟳ 重新选择需求</button>
    </div>

    <!-- Footer -->
    <div class="footer-text">
      ⚠️ 本工具仅供学习和参考<br>
      传统药香讲究君臣佐辅，建议根据个人体质调整<br>
      数据源自经典香谱与传统和香技艺
    </div>
  </div>

  <script>
    // ===== DATA =====
    const SYMPTOM_GROUPS = [
      {
        label: '🧠 神志/情绪类',
        symptoms: [
          {id:'shi_mian',text:'失眠多梦、心神不宁'},
          {id:'fan_zao',text:'心烦意乱、焦虑不安'},
          {id:'yu_yu',text:'情绪低落、郁闷不乐'},
          {id:'pi_juan',text:'精神疲惫、注意力不集中'},
        ]
      },
      {
        label: '🏠 居家/环境类',
        symptoms: [
          {id:'yi_qi',text:'祛疫避秽、净化空气'},
          {id:'qu_wen',text:'驱蚊防虫、除湿'},
          {id:'yi_wei',text:'去除异味、清新空气'},
        ]
      },
      {
        label: '🧘 养生/调理类',
        symptoms: [
          {id:'ti_shen',text:'提神醒脑、增强记忆'},
          {id:'an_shen',text:'安神定志、帮助冥想'},
          {id:'yang_yan',text:'养颜美容、调养气血'},
          {id:'yang_sheng',text:'日常养生、延年益寿'},
        ]
      },
      {
        label: '🤧 身体不适类',
        symptoms: [
          {id:'tou_tong',text:'头痛头晕、鼻塞不通'},
          {id:'han_qi',text:'寒气入体、畏寒怕冷'},
          {id:'wei_tong',text:'胃脘不适、消化不良'},
        ]
      }
    ];

    // ===== KNOWLEDGE BASE =====
    const PRESCRIPTIONS = [
      {
        id:'an_shen_xin',
        name:'安神香',
        pinyin:'An Shen Xiang',
        matchTags:['shi_mian','an_shen','fan_zao'],
        matchLevel:'高',
        ingredients:[
          {name:'檀香',amount:'5g'},{name:'沉香',amount:'3g'},
          {name:'乳香',amount:'3g'},{name:'安息香',amount:'2g'},
          {name:'酸枣仁',amount:'3g'},{name:'柏子仁',amount:'2g'}
        ],
        action:'安神定志，助眠宁心。此香方源自宋代《陈氏香谱》安神方，以檀香为君、沉香为臣，香气沉稳醇厚，能让人心神安定，缓解焦虑，尤其适合睡前焚用。',
        method:'睡前1小时在卧室内焚香。可用电熏炉低温（100-120°C）熏烤，或直接焚烧香粉/线香。切忌过量，微香即可。',
        caution:'孕妇慎用。卧室焚香注意通风，不宜整夜燃香。实热体质者用量减半。'
      },
      {
        id:'ti_shen_xin',
        name:'醒脑香',
        pinyin:'Xing Nao Xiang',
        matchTags:['ti_shen','pi_juan','tou_tong'],
        matchLevel:'高',
        ingredients:[
          {name:'薄荷',amount:'5g'},{name:'龙脑',amount:'2g'},
          {name:'白芷',amount:'4g'},{name:'川芎',amount:'3g'},
          {name:'冰片',amount:'1g'},{name:'石菖蒲',amount:'4g'}
        ],
        action:'提神醒脑，通窍开郁。此方以薄荷、龙脑为君，气味清凉透窍，能振奋精神、改善头痛鼻塞、增强注意力。古代文人读书时常焚此香以助专注。',
        method:'适合工作学习时焚用。用电熏炉低温（80-100°C）熏烤，或制作香囊随身佩戴。也可取少量香粉直接闻嗅。',
        caution:'晚上不宜使用，以免影响睡眠。气虚多汗者慎用。孕妇禁用冰片。'
      },
      {
        id:'qu_yi_xiang',
        name:'祛疫避秽香',
        pinyin:'Qu Yi Bi Hui Xiang',
        matchTags:['yi_qi'],
        matchLevel:'高',
        ingredients:[
          {name:'苍术',amount:'10g'},{name:'艾叶',amount:'8g'},
          {name:'白芷',amount:'5g'},{name:'藿香',amount:'5g'},
          {name:'丁香',amount:'4g'},{name:'石菖蒲',amount:'5g'},
          {name:'薄荷',amount:'3g'}
        ],
        action:'祛疫辟秽，芳香化浊。本方是传统防疫香方，源自明清时期瘟疫防治经验。苍术、艾叶配伍擅长燥湿祛秽，对空气有良好的净化作用，能抑制空气中病菌，适合季节交替或流感高发期。',
        method:'可直接点燃作熏香，或放入电熏炉（120-150°C）。也可用布包制成香囊悬挂于室内或随身佩戴。建议每周熏2-3次。',
        caution:'苍术用量较大，气味浓郁，敏感者用量减半。哮喘患者慎用。孕妇忌用。'
      },
      {
        id:'qu_wen_xiang',
        name:'驱蚊香',
        pinyin:'Qu Wen Xiang',
        matchTags:['qu_wen'],
        matchLevel:'高',
        ingredients:[
          {name:'艾草',amount:'10g'},{name:'薄荷',amount:'6g'},
          {name:'藿香',amount:'5g'},{name:'丁香',amount:'4g'},
          {name:'白芷',amount:'4g'},{name:'浮萍',amount:'5g'}
        ],
        action:'驱蚊避虫，芳香除湿。天然草药驱蚊香方，不含化学驱蚊成分。艾草与薄荷的配伍气味清烈，蚊虫不喜，同时能祛除室内湿气，尤其适合夏季使用。',
        method:'傍晚时分在门窗附近点燃香粉或线香。也可做成香囊挂在床头或随身佩戴。电熏炉温度120-140°C效果最佳。',
        caution:'过敏体质者先小量试用。孕妇慎用艾草。不宜在密闭小空间大量焚香。'
      },
      {
        id:'jie_yu_xiang',
        name:'解郁香',
        pinyin:'Jie Yu Xiang',
        matchTags:['yu_yu','fan_zao'],
        matchLevel:'高',
        ingredients:[
          {name:'檀香',amount:'4g'},{name:'乳香',amount:'4g'},
          {name:'甘松',amount:'3g'},{name:'桂花',amount:'3g'},
          {name:'玫瑰花',amount:'3g'},{name:'沉香',amount:'2g'}
        ],
        action:'疏肝解郁，行气悦心。此方以乳香、甘松为主调，花香为辅，香气温暖甜美、层次丰富。能疏解肝气郁结、舒缓情绪，让人心情愉悦。源自明代《香乘》中解郁方改良。',
        method:'午后或傍晚焚用效果最佳。电熏炉低温（90-110°C）熏烤，可搭配茶饮一同品香。制作香囊随身佩戴亦佳。',
        caution:'花香类配方，花粉过敏者注意。孕妇慎用乳香。'
      },
      {
        id:'qing_xin_xiang',
        name:'清心香',
        pinyin:'Qing Xin Xiang',
        matchTags:['an_shen','fan_zao','yi_qi'],
        matchLevel:'中',
        ingredients:[
          {name:'沉香',amount:'5g'},{name:'檀香',amount:'3g'},
          {name:'龙脑',amount:'1g'},{name:'甘松',amount:'2g'},
          {name:'白芷',amount:'2g'},{name:'白芍',amount:'2g'}
        ],
        action:'清心除烦，安和五脏。沉香为君，香气清雅悠远，能引气归元、清心降火。配合龙脑的清凉透感，去除心中烦热，适合心火旺盛、烦躁不宁时使用。',
        method:'适合白天的冥想或阅读时焚用。用电熏炉低温（100-120°C）熏烤，香气持久。每次用量不要过多。',
        caution:'体寒畏冷者慎用。龙脑量小即可，不宜多放。孕妇禁用龙脑。'
      },
      {
        id:'chan_xiu_xiang',
        name:'禅修香',
        pinyin:'Chan Xiu Xiang',
        matchTags:['an_shen','ti_shen'],
        matchLevel:'中',
        ingredients:[
          {name:'沉香',amount:'6g'},{name:'檀香',amount:'4g'},
          {name:'乳香',amount:'2g'},{name:'安息香',amount:'2g'},
          {name:'没药',amount:'1g'}
        ],
        action:'定心安神，助益禅定。此方为传统修行用香，以沉香、檀香为基底，香气沉稳内敛，能帮助收摄心神、进入冥想状态。古人修行打坐必备此香。',
        method:'打坐、冥想、瑜伽时焚用。电熏炉低温（100-120°C）或直接焚篆香。环境保持安静通风，用心品味香气变化。',
        caution:'没药味苦，初次使用可能不适应。孕妇慎用乳香、没药。'
      },
      {
        id:'yang_yan_xiang',
        name:'养颜香',
        pinyin:'Yang Yan Xiang',
        matchTags:['yang_yan','yu_yu'],
        matchLevel:'中',
        ingredients:[
          {name:'桂花',amount:'5g'},{name:'玫瑰花',amount:'5g'},
          {name:'檀香',amount:'3g'},{name:'当归',amount:'3g'},
          {name:'川芎',amount:'2g'},{name:'白芍',amount:'2g'}
        ],
        action:'养血调气，香养容颜。桂花与玫瑰配伍香气甜润芬芳，配合当归、川芎活血养血。长期熏闻有助于气血调和、面色红润。此方为宋代宫妃养颜秘方化裁而来。',
        method:'可做香囊随身佩戴，或用电熏炉低温（80-100°C）熏烤。每日熏闻半小时即可。也可加入浴水中泡浴。',
        caution:'孕妇慎用当归、川芎。花香浓郁，头晕者减量使用。'
      },
      {
        id:'yang_sheng_xin',
        name:'养生香',
        pinyin:'Yang Sheng Xin',
        matchTags:['yang_sheng','pi_juan'],
        matchLevel:'中',
        ingredients:[
          {name:'黄芪',amount:'5g'},{name:'茯苓',amount:'4g'},
          {name:'白术',amount:'3g'},{name:'陈皮',amount:'3g'},
          {name:'檀香',amount:'3g'},{name:'甘草',amount:'2g'}
        ],
        action:'益气健脾，养生延年。此方融合香道与养生，以草木之香调养脾胃之气。黄芪、茯苓为君，补气健脾、祛湿安神，气味温和醇厚，适合长期使用。',
        method:'日常养生可每日上午焚用。电熏炉100-120°C熏烤，香气平和持久。也可装入香囊置于办公室或卧室。',
        caution:'感冒发热时暂停使用。阴虚火旺者慎用。'
      },
      {
        id:'qu_han_xiang',
        name:'暖宫驱寒香',
        pinyin:'Nuan Gong Qu Han Xiang',
        matchTags:['han_qi','yang_yan'],
        matchLevel:'中',
        ingredients:[
          {name:'艾叶',amount:'6g'},{name:'肉桂',amount:'3g'},
          {name:'小茴香',amount:'3g'},{name:'丁香',amount:'3g'},
          {name:'当归',amount:'4g'},{name:'川芎',amount:'3g'},
          {name:'沉香',amount:'2g'}
        ],
        action:'温经散寒，暖宫调血。传统温养香方，以艾叶、肉桂温通经络，配合当归、川芎调养血气。适合手脚冰凉、畏寒怕冷的体质，尤其女性经期前后使用效果更佳。',
        method:'制成香囊贴敷于腹部或腰部，或用电熏炉低温（100-120°C）熏闻。经期前一周开始使用效果最好。',
        caution:'实热体质、发热患者禁用。孕妇禁用。经量过多者经期暂停使用。'
      },
      {
        id:'wei_tong_xiang',
        name:'和胃香',
        pinyin:'He Wei Xiang',
        matchTags:['wei_tong','yi_qi'],
        matchLevel:'中',
        ingredients:[
          {name:'砂仁',amount:'4g'},{name:'豆蔻',amount:'3g'},
          {name:'陈皮',amount:'4g'},{name:'藿香',amount:'3g'},
          {name:'木香',amount:'2g'},{name:'甘草',amount:'2g'}
        ],
        action:'行气和胃，芳香化湿。以砂仁、豆蔻为君，香气辛香温散，能促进胃肠蠕动、缓解胀气不适。适合饭后或胃脘胀闷时使用。',
        method:'饭后焚闻。可制作香囊佩戴于胃脘部，或电熏炉90-110°C熏烤。也可少量直接闻嗅香粉。',
        caution:'胃热灼痛者不宜使用。孕妇慎用。'
      }
    ];

    // ===== STATE =====
    let selectedSymptoms = new Set();

    // ===== RENDER SYMPTOMS =====
    function renderSymptoms(){
      const container = document.getElementById('symptomContainer');
      container.innerHTML = SYMPTOM_GROUPS.map(group => `
        <div class="symptom-group">
          <div class="symptom-label">${group.label}</div>
          <div class="tag-wrap">
            ${group.symptoms.map(s => `
              <div class="tag ${selectedSymptoms.has(s.id) ? 'selected' : ''}"
                   onclick="toggleSymptom('${s.id}')">
                ${s.text}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function toggleSymptom(id){
      if(selectedSymptoms.has(id)){
        selectedSymptoms.delete(id);
      } else {
        selectedSymptoms.add(id);
      }
      renderSymptoms();
      updateSubmitButton();
    }

    function updateSubmitButton(){
      const btn = document.getElementById('btnSubmit');
      btn.disabled = selectedSymptoms.size === 0;
      btn.textContent = selectedSymptoms.size === 0
        ? '🪔 请至少选择一个需求'
        : `🪔 查看推荐香方 (已选${selectedSymptoms.size}项)`;
    }

    // ===== MATCHING ENGINE =====
    function getPrescription(){
      if(selectedSymptoms.size === 0){ alert('请至少选择一个需求'); return; }

      const selected = [...selectedSymptoms];

      const scored = PRESCRIPTIONS.map(p => {
        let matchCount = 0;
        p.matchTags.forEach(tag => {
          if(selected.includes(tag)) matchCount++;
        });
        let partialScore = 0;
        selected.forEach(s => {
          p.matchTags.forEach(tag => {
            if(s !== tag && isRelated(s, tag)) partialScore += 0.3;
          });
        });
        return { ...p, score: matchCount + partialScore };
      });

      const ranked = scored.filter(p => p.score > 0).sort((a, b) => b.score - a.score);
      const results = ranked.slice(0, 2);

      if(results.length === 0){
        alert('当前需求未匹配到经典香方，建议查阅更专业的香谱。');
        return;
      }

      showResults(results);
    }

    const RELATED_MAP = {
      'shi_mian': ['fan_zao','an_shen'],
      'fan_zao': ['shi_mian','yu_yu'],
      'yu_yu': ['fan_zao','pi_juan'],
      'pi_juan': ['ti_shen','yang_sheng'],
      'yi_qi': ['yi_wei','wei_tong'],
      'qu_wen': ['yi_qi','yi_wei'],
      'an_shen': ['shi_mian','chan_xiu'],
      'ti_shen': ['pi_juan'],
      'yang_yan': ['an_shen','han_qi'],
      'han_qi': ['wei_tong','yang_yan'],
    };

    function isRelated(s1, s2){
      return (RELATED_MAP[s1] && RELATED_MAP[s1].includes(s2)) ||
             (RELATED_MAP[s2] && RELATED_MAP[s2].includes(s1));
    }

    // ===== SHOW RESULTS =====
    function showResults(results){
      const resultArea = document.getElementById('resultArea');
      const container = document.getElementById('prescriptionContainer');
      const inputCard = document.getElementById('inputCard');

      container.innerHTML = results.map(r => {
        const badgeCls = r.matchLevel === '高' ? 'high' : 'medium';
        return `
          <div class="prescription-card">
            <div class="prescription-header">
              <h2>${r.name}</h2>
              <div class="pinyin">${r.pinyin}</div>
              <div class="match-badge ${badgeCls}">匹配度：${r.matchLevel}</div>
            </div>
            <div class="prescription-body">
              <div class="ingredient-list">
                <h4>📝 香方组成</h4>
                ${r.ingredients.map(i =>
                  `<div class="ingredient-item"><span class="name">${i.name}</span><span class="amount">${i.amount}</span></div>`
                ).join('')}
              </div>
              <div class="action-section">
                <h4>💊 功效与作用</h4>
                <p>${r.action}</p>
              </div>
              <div class="method-section">
                <h4>🔥 使用方式</h4>
                <p>${r.method}</p>
              </div>
              <div class="caution-section">
                <h4>⚠️ 注意事项</h4>
                <p>${r.caution}</p>
              </div>
            </div>
          </div>
        `;
      }).join('');

      inputCard.style.display = 'none';
      resultArea.classList.add('show');
      resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ===== RESET =====
    function resetAll(){
      selectedSymptoms.clear();
      document.getElementById('inputCard').style.display = 'block';
      document.getElementById('resultArea').classList.remove('show');
      renderSymptoms();
      updateSubmitButton();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ===== INIT =====
    renderSymptoms();
    updateSubmitButton();
  </script>
</body>
</html>
